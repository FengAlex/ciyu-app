/* PWA v2 — respect safe areas and keep the question count above all artwork. */
.nav{grid-template-columns:repeat(5,minmax(0,1fr))}
.flashcard:after{z-index:0;opacity:.66}
.flashcard>*{position:relative;z-index:1}
.card-top{isolation:isolate;flex-wrap:wrap;min-height:40px;align-items:flex-start}
.card-top .tiny-tag{max-width:60%;min-width:0;overflow-wrap:anywhere}
.counter{background:#fff;border-radius:10px;padding:7px 8px;color:#536985;font-size:12px;font-weight:800;white-space:nowrap;margin-left:auto}
.card-word{max-width:100%;overflow-wrap:anywhere}
.page-head h2{line-height:1.25}
.day-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:14px}
.day-label{text-align:center;color:#95a5b8;font-size:10px}
.day-cell{border:0;min-height:43px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f1f5fa;color:#7b8fa7;font-size:11px;gap:2px}
.day-cell.has{background:#dceafb;color:#245388}
.day-cell.high{background:#245388;color:#fff}
.day-cell.selected{outline:2px solid #b17b38;outline-offset:2px}
.day-cell.today{font-weight:900}
.day-cell i{font-size:8px;font-style:normal}
.record{border-bottom:1px solid #e9eef4;padding:11px 0;display:flex;align-items:flex-start;gap:9px;justify-content:space-between}
.record:last-child{border-bottom:none}
.record strong{font-size:13px;line-height:1.5}
.record small{display:block;color:#91a0b2;font-size:11px;margin-top:3px}
.grade-tag{white-space:nowrap;padding:5px 9px;border-radius:10px;font-size:11px;font-weight:750;color:#245388;background:#e9f1ff}
.grade-tag.again{background:#fff0ed;color:#ba594f}
.grade-tag.hard{background:#fff2dc;color:#a47a2f}
.grade-tag.good{background:#e8f6ec;color:#257b5b}
.ocr-preview{width:100%;max-height:220px;object-fit:contain;background:#f2f5f9;border-radius:14px;margin-bottom:12px}
.ocr-progress{background:#e5eef9;border-radius:20px;height:8px;overflow:hidden;margin:10px 0}
.ocr-progress>div{height:100%;background:#245388;width:0;transition:width .2s}
.ocr-draft{border:1px solid #e4ebf2;border-radius:13px;padding:12px;margin-top:10px;background:#fbfdff}
.ocr-draft .field{margin:8px 0}
.ocr-tip{border-radius:13px;padding:12px;background:#eaf3fc;color:#60758f;font-size:12px;line-height:1.7}
.photo-card .photo-actions{display:flex;gap:6px;padding:0 9px 10px}
.photo-card .photo-actions button{position:static;width:auto;height:32px;flex:1;border-radius:9px;background:#edf4ff;color:#245388;font-size:11px;box-shadow:none;font-weight:750}
.photo-card .photo-actions button:last-child{flex:0 0 32px;background:#fff0ed;color:#b65c51}
.backup-banner{border-radius:14px;background:#fff2dd;color:#8b682a;padding:11px 12px;font-size:11px;line-height:1.6;margin-top:12px}
@media(max-width:365px){.nav{padding-left:4px;padding-right:4px}.nav button{font-size:9px}.flashcard{padding:17px 13px 18px}.card-word{letter-spacing:1px}.counter{font-size:10px;padding:6px}.card-top .tiny-tag{font-size:10px}}

.flashcard:after{z-index:0;opacity:.28}

.group-answer:last-of-type{border-bottom:none}

/* When new photos are recognized, an empty line terminates a memory group.
   OCR cannot reliably infer notebook spacing: user can correct each group number. */
function parseOCRText(raw){
 let groupNo=1,afterWords=false,out=[];
 for(const sourceLine of raw.replace(/\r/g,'').split('\n')){
  const line=sourceLine.trim();
  if(!line){if(afterWords){groupNo++;afterWords=false}continue}
  const m=line.match(/^\s*(?:\d+[.、．)]\s*)?([\u3400-\u9fff]{2,15})\s*[：:﹕]\s*(.{1,})$/u);
  if(m){out.push({term:m[1],meaning:m[2],groupKey:String(groupNo)});afterWords=true}
  else if(out.length&&out[out.length-1].meaning.length<700)out[out.length-1].meaning+=' '+line;
 }
 return out.slice(0,80)
}

function allGroups(){

  const members=(spec.terms||[]).map(t=>index.get(t)).filter(Boolean);
  if(!members.length)continue;
  groups.push({...spec,members});members.forEach(c=>assigned.add(c.id));
 }

}

 $('#tab-home').innerHTML=`<div class="hero"><div class="eyebrow">空行分段 · 连写成组</div><h1>今天，一组一组记。</h1><div class="hero-sub">${s.groups} 组笔记 · ${s.total} 个词条，先辨区别再翻答案。</div><div class="hero-foot"><div class="hero-small"><strong>${Math.min(s.done,data.goal)}</strong> / ${data.goal} 今日目标（组）</div><div class="hero-track"><div class="hero-fill" style="width:${pct}%"></div></div></div></div><div class="quickstats"><div class="stat"><div class="stat-num">${s.total}</div><div class="stat-label">词条总数</div></div><div class="stat"><div class="stat-num">${s.groups}</div><div class="stat-label">连记分组</div></div><div class="stat"><div class="stat-num">${s.mastered}</div><div class="stat-label">较熟悉</div></div></div><div class="sectionbar"><div class="section-title">${mode==='random'?'随心抽查':'今日复习'}</div><div class="section-meta">${mode==='random'?'随机抽取完整笔记组':'第 '+(s.done+1)+' 组 · 先分辨再看答案'}</div></div><div id="cardArea">${!g?`<div class="done"><div class="done-art">✦</div><h2>${s.total?'今天的目标完成啦！':'还没有词条'}</h2><p>${s.total?'相邻词语一起记，别忘了保存学习备份。':'去词库添加词语或拍照导入。'}</p><button class="mini-primary" data-act="random">${svg('shuffle')} 继续随机抽查</button></div>`:renderCard(g)}</div><div class="card-actions"><button data-act="daily" class="${mode==='daily'?'emphasis':''}">${svg('calendar',15)} 今日计划</button><button data-act="random" class="${mode==='random'?'emphasis':''}">${svg('shuffle',15)} 随心抽查</button></div><div class="tip">${svg('info',17)}<span>明确留白的笔记分开记；紧挨着的词语一起复习。每次评分按“整组”写入学习足迹。</span></div>`;
}
function renderCard(g){const members=g.members;const isGroup=members.length>1;const headline=members.map(c=>safe(c.term)).join('<span class="joiner"> ／ </span>');const subtitle=isGroup?'先想想这 '+members.length+' 个词各是什么意思，区别在哪？':'在心里想一想：它是什么意思？';
 const answer=members.map((c,i)=>`<div class="group-answer"><div class="group-term">${i+1}. ${safe(c.term)}</div><div class="def-mini">${safe(c.meaning)}</div>${c.needsReview?'<div class="review-label">手写词形建议核对</div>':''}</div>`).join('');
 return `<div class="flashcard"><div class="card-top"><span class="tiny-tag">${svg('spark',13)} ${isGroup?'连记辨析 · '+members.length+' 词':'单独记忆'}</span><span class="counter">${mode==='daily'?`第 ${logsToday().length+1} / ${data.goal} 组`:'随机复习'}</span></div><div class="card-front"><div class="card-word ${isGroup?'multi-word':''}">${headline}</div><div class="card-hint">${subtitle}</div></div>${!revealed?`<button class="reveal-btn" data-act="reveal">${isGroup?'查看整组释义和区别':'点击查看释义'} ${svg('arrow',18)}</button>`:`<div class="definition"><div class="def-label">笔记第 ${g.page||members[0].sourcePage||'?'} 张 · ${safe(g.label||'释义')}</div>${answer}${isGroup?`<p class="group-reminder">这 ${members.length} 个词在原笔记中写在一起，请对照辨析。不同组之间并不默认存在关联。</p>`:''}<div class="def-section" style="display:flex;align-items:center;justify-content:space-between"><span class="def-mini">如有笔误，可到词库中修改</span><button class="speak" data-act="speak">${svg('volume',14)} 朗读</button></div></div><div class="grading"><button class="grade again" data-grade="again">忘了</button><button class="grade hard" data-grade="hard">模糊</button><button class="grade good" data-grade="good">整组记住了</button></div>`}</div>`;
}
function random(){const groups=allGroups();if(!groups.length){tab='bank';openEdit();render(true);return}mode='random';const choices=groups.filter(g=>g.id!==currentId);const pick=choices.length?choices[Math.floor(Math.random()*choices.length)]:groups[0];currentId=pick.id;revealed=false;tab='home';render(true)}
function grade(key){const group=groupById(currentId);if(!group||!revealed)return;const n=ratings[key],intervals=[1,3,7,14,30,60,120,240,360];for(const c of group.members){if(n===0){c.stage=0;c.due=addDays(today(),1)}else if(n===1){c.stage=Math.max(1,c.stage);c.due=addDays(today(),2)}else{c.stage=Math.min(8,c.stage+1);c.due=addDays(today(),intervals[Math.min(8,c.stage)])}c.reviews++;c.last=today()}
 data.logs.push({date:today(),id:group.id,groupId:group.id,term:groupName(group),at:new Date().toISOString(),mode,grade:key,curriculum:BOOK_REVISION});data.logs=data.logs.slice(-15000);currentId='';revealed=false;persist();render();toast({again:'整组已标为“忘了”',hard:'整组已安排巩固复习',good:'整组记住了！'}[key])}
function speak(){const g=groupById(currentId);if(!g)return;if(!('speechSynthesis' in window))return toast('当前浏览器不支持朗读');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(g.members.map(c=>c.term+'。'+c.meaning).join('。'));u.lang='zh-CN';u.rate=.85;speechSynthesis.speak(u)}
function bank(){const grouped=allGroups().filter(g=>{const content=g.members.map(c=>c.term+' '+c.meaning+' '+c.contrast).join(' ')+(g.label||'');const match=filter==='全部'||(filter==='待复习'&&g.members.some(c=>c.due<=today()))||(filter==='较熟悉'&&g.members.every(c=>c.stage>=3))||(filter==='连记辨析'&&g.members.length>1)||(filter==='单独记忆'&&g.members.length===1);return match&&content.toLowerCase().includes(search.toLowerCase())});
 $('#tab-bank').innerHTML=`<div class="page-head"><div><div class="eyebrow">严格按笔记空行分段</div><h2 class="heading">我的词库</h2><p class="muted">${data.cards.length} 个词条 · ${allGroups().length} 组，整组可点开辨析。</p></div><button class="icon-btn" data-act="add" aria-label="添加词条">${svg('plus',20)}</button></div><div class="search">${svg('book',18)}<input id="searchField" placeholder="搜索成语、释义、辨析…" value="${safe(search)}" autocomplete="off" aria-label="搜索词条"></div><div class="pills">${['全部','连记辨析','单独记忆','待复习','较熟悉'].map(f=>`<button class="pill ${f===filter?'selected':''}" data-filter="${safe(f)}">${f}</button>`).join('')}</div><div class="wordlist">${grouped.map(g=>`<button class="word-item group-list-row" data-open-group="${safe(g.id)}"><span class="word-tile">${g.members.length>1?g.members.length: safe(g.members[0].term.slice(0,1))}</span><span class="word-info"><span class="word-term">${safe(groupName(g))}</span><span class="word-preview">${safe(g.label||g.members[0].meaning)}</span><span class="word-origin">${g.page?'笔记 '+g.page+' · ':''}${g.members.length>1?'连记辨析':'单独记忆'}</span></span><span class="word-arrow">${svg('arrow',16)}</span></button>`).join('')||'<div class="empty">没有符合条件的分组。</div>'}</div>`;
}
function openGroup(gid){const g=groupById(gid);if(!g)return;modalType='group';modal(`<div class="sheet-top"><h2>${safe(g.label||'词语辨析')}</h2><button class="close" data-act="close">×</button></div><div class="ocr-tip">${g.page?'来源：第 '+g.page+' 张笔记。':''}原笔记里紧挨着的词归为一组；留白分开的词不合并。</div>${g.members.map(c=>`<div class="group-detail"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><h3>${safe(c.term)}</h3><button class="mini-light" data-edit="${safe(c.id)}">编辑</button></div><p>${safe(c.meaning)}</p>${c.needsReview?'<small class="review-label">请与原图核对这条手写笔记</small>':''}</div>`).join('')}<button class="mini-primary" style="width:100%;margin-top:12px" data-start="${safe(g.id)}">复习这一整组</button>`)}
function removeFromGroups(term){for(const g of data.groups||[])g.terms=(g.terms||[]).filter(x=>x!==term)}
function saveForm(form){const fd=new FormData(form),term=String(fd.get('term')||'').trim(),meaning=String(fd.get('meaning')||'').trim();if(!term||!meaning)return toast('词语和释义不能留空');const id=String(fd.get('id')||''), current=data.cards.find(c=>c.id===id);if(!current&&data.cards.some(c=>c.term===term))return toast('词库已存在这个词条，请直接编辑');const oldTerm=current?.term;const update={term,meaning,contrast:String(fd.get('contrast')||'').trim(),example:String(fd.get('example')||'').trim(),tag:String(fd.get('tag')||'单独记忆'),pair:String(fd.get('pair')||'').trim()};if(current){Object.assign(current,update);if(oldTerm!==term)for(const g of data.groups||[])g.terms=(g.terms||[]).map(x=>x===oldTerm?term:x)}else data.cards.unshift(cleanCard(update));persist();closeModal();render();toast(current?'修改已保存':'添加成功')}
function exportLegacy(){const raw=localStorage.getItem('ciyu-pre-v3-snapshot');if(!raw){toast('未检测到旧词库快照');return}dl(raw,'词屿-升级前旧词库-备份.json');toast('已导出升级前词库')}

$('#nav').addEventListener('click',e=>{let btn=e.target.closest('button[data-tab]');if(!btn)return;tab=btn.dataset.tab;render(true)});
$('#app').addEventListener('click',async e=>{let f=e.target.closest('button');if(!f)return;
if(f.dataset.grade){grade(f.dataset.grade);return}
if(f.dataset.filter){filter=f.dataset.filter;bank();return}
if(f.dataset.detail){detail(f.dataset.detail);return}
if(f.dataset.openGroup){openGroup(f.dataset.openGroup);return}
if(f.dataset.edit){let id=f.dataset.edit;openEdit(id);return}
if(f.dataset.pair){let c=data.cards.find(c=>c.term===f.dataset.pair);if(c)detail(c.id);else toast('暂无对应词条');return}
if(f.dataset.start){currentId=f.dataset.start;revealed=false;mode='random';closeModal();tab='home';render(true);return}
if(f.dataset.ocrPhoto){openOCR(f.dataset.ocrPhoto);return}
if(f.dataset.day){selectedDay=f.dataset.day;history();return}
if(f.dataset.removeOcr!==undefined){const ix=Number(f.dataset.removeOcr);if(Number.isInteger(ix)){readDraftValues();ocrItems.splice(ix,1);drawOCRItems()}return}
if(f.dataset.viewPhoto){const photo=photos.find(p=>p.id===f.dataset.viewPhoto);if(photo){modalType='photo';modal(`<div class="sheet-top"><h2>${safe(photo.title)}</h2><button class="close" data-act="close">×</button></div><img class="photo-full" src="${photo.data}" alt="笔记大图"><p class="muted" style="margin-top:12px">可以使用双指缩放浏览器页面来查看笔记。</p>`)}return}
if(f.dataset.delPhoto){let id=f.dataset.delPhoto;if(!confirm('删除这张笔记照片？'))return;await dbDelete(id);photos=photos.filter(p=>p.id!==id);render();toast('已删除照片');return}
const act=f.dataset.act;
if(act==='reveal'){revealed=true;home()}
else if(act==='speak')speak();
else if(act==='daily'){mode='daily';currentId='';revealed=false;render()}
else if(act==='random'){random()}
else if(act==='add')openEdit();
else if(act==='close'){if(modalType==='ocr')await saveOCRRaw();closeModal()}
else if(act==='delete'){let c=data.cards.find(x=>x.id===$('#editForm [name=id]')?.value);if(c&&confirm('确定删除「'+c.term+'」吗？')){data.cards=data.cards.filter(x=>x.id!==c.id);removeFromGroups(c.term);persist();closeModal();render();toast('词条已删除')}}
else if(act==='import')importRows();
else if(act==='backup')await backup();
else if(act==='legacyBackup')exportLegacy();
else if(act==='restore')$('#restoreFile').click();
else if(act==='reset')await reset();
else if(act==='history'){tab='history';render(true)}
else if(act==='ocrRun')await runOCR();
else if(act==='ocrParse')parseOCRFromTextarea();
else if(act==='ocrBlank'){ocrItems.push({term:'',meaning:'',groupKey:String(ocrItems.length+1)});drawOCRItems()}
else if(act==='ocrSave')saveOCRItems();
});
$('#app').addEventListener('input',e=>{if(e.target.id==='searchField'){search=e.target.value;const caret=e.target.selectionStart;bank();const input=$('#searchField');input.focus();input.setSelectionRange(caret,caret)}if(e.target.id==='importBox')importText=e.target.value});
$('#app').addEventListener('change',async e=>{if(e.target.id==='photoInput'){await addPhoto(e.target.files);e.target.value=''}if(e.target.id==='dailyGoal'){data.goal=Number(e.target.value);persist();render();toast('每日目标已更新')}if(e.target.id==='restoreFile'){const file=e.target.files[0];if(file)await restore(file);e.target.value=''}});
$('#app').addEventListener('submit',e=>{if(e.target.getAttribute('id')==='editForm'){e.preventDefault();saveForm(e.target)}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modalType==='ocr')saveOCRRaw();closeModal()}});
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('离线缓存未启用',e));
if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});
render();initPhotos();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(lastDay!==today()){lastDay=today();currentId='';revealed=false;}render();}});
</script></body></html>
